name: Parallel Card Market Sync Part B

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Supabase
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir supabase
          
      - name: Fetch Sets (Part B)
        id: set-matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os, json
          from supabase import create_client
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
          
          # 🎯 THE FIX 1: Fetch 'sport' from Supabase
          sets = supabase.table('card_sets').select('year, brand, series, sport').execute().data or []
          
          # 🎯 THE FIX 2: Add 'sport' to the tuple so cross-sport sets aren't overwritten
          unique = { (str(s['year']), s['brand'].strip(), s['series'].strip(), str(s.get('sport', ''))) for s in sets }
          
          unique_list = [{'year': u[0], 'brand': u[1], 'series': u[2], 'sport': u[3]} for u in unique]
          # Grabs everything from index 144 to the end of the list
          final_list = sorted(unique_list, key=lambda x: (x['year'], x['brand'], x['sport']))[220:]
          matrix_json = json.dumps({'include': final_list})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix_json}\n')
          "

  scrape-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests beautifulsoup4 supabase aiohttp
          
      # 🎯 THE FIX 3: Pass the sport as a 4th argument to your scraper script
      - run: python update_by_set.py "${{ matrix.year }}" "${{ matrix.brand }}" "${{ matrix.series }}" "${{ matrix.sport }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
