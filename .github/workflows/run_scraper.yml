name: CardCompHub Price Tracker Pipeline

on:
  schedule:
    # ⏰ Runs automatically every single night at 12:00 AM UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 🛠️ This enables a manual "Run Workflow" button inside your GitHub web dashboard

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository Base
      uses: actions/checkout@v4

    - name: Initialize Runtime Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Core Pipeline Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 supabase

    - name: Execute Background Sync Automation
      # 🚀 Safely injects the encrypted repository secrets you just saved into the environment containers
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
      run: python update_comps.py