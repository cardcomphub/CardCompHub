name: Parallel Card Market Sync Part A

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Supabase
        run: pip install supabase
      - name: Fetch Sets (Part A)
        id: set-matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os, json
          from supabase import create_client
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
          sets = supabase.table('card_sets').select('year, brand, series').execute().data or []
          unique = { (str(s['year']), s['brand'].strip(), s['series'].strip()) for s in sets 
                     if not (s['brand'].strip().lower() == 'panini' and s['series'].strip().lower() == 'donruss') }
          unique_list = [{'year': u[0], 'brand': u[1], 'series': u[2]} for u in unique]
          final_list = sorted(unique_list, key=lambda x: (x['year'], x['brand']))[:144]
          matrix_json = json.dumps({'include': final_list})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix_json}\n')
          "

  scrape-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 supabase aiohttp
      - run: python update_by_set.py "${{ matrix.year }}" "${{ matrix.brand }}" "${{ matrix.series }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
