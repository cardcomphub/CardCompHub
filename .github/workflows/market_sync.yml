name: Parallel Card Market Sync (Excluding Donruss & Topps Chrome)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Supabase Client
        run: pip install supabase

      - name: Fetch Active Sets From Supabase
        id: set-matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os, json, sys
          from supabase import create_client
          
          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_KEY')
          if not url or not key:
              sys.exit(1)
              
          supabase = create_client(url, key)
          res = supabase.table('card_sets').select('year, brand, series').execute()
          sets = res.data or []
          
          unique_sets = []
          seen = set()
          for s in sets:
              year_str = str(s['year'])
              brand_str = s['brand'].strip()
              series_str = s['series'].strip()
              
              # 🛑 EXCLUSION FILTERS
              # 1. Skip standard Panini Donruss
              if brand_str.lower() == 'panini' and series_str.lower() == 'donruss':
                  continue
                  
              # 2. Skip standard Topps Chrome (keeps 'Chrome x Cactus Jack' safe)
              if brand_str.lower() == 'topps' and series_str.lower() == 'chrome':
                  continue
                  
              key_tuple = (year_str, brand_str, series_str)
              if key_tuple not in seen:
                  seen.add(key_tuple)
                  unique_sets.append({
                      'year': key_tuple[0],
                      'brand': key_tuple[1],
                      'series': key_tuple[2]
                  })
          
          matrix_data = {'include': unique_sets}
          print(f'🚀 Generated dynamic matrix mapping for {len(unique_sets)} filtered sets.')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={json.dumps(matrix_data)}\n')
          "

  scrape-market-matrix:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    name: Sync (${{ matrix.year }} ${{ matrix.brand }} ${{ matrix.series }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run Matrix Targeted Sync Task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python update_by_set.py "${{ matrix.year }}" "${{ matrix.brand }}" "${{ matrix.series }}"