name: Parallel Card Market Sync

on:
  workflow_dispatch: # Allows one-click manual triggers from GitHub Actions UI
  schedule:
    - cron: '0 3 * * *' # Automatically triggers every day at 3:00 AM UTC

jobs:
  scrape-market-matrix:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2 # 🛡️ Safe concurrency ceiling to avoid blowing out your ScraperAPI rate limits
      fail-fast: false
      matrix:
        include:
          # 🎯 EXPLICIT SETS EXTRACTED FROM YOUR DB SCREENSHOTS
          - year: "2025"
            brand: "Topps"
            series: "Chrome"
          - year: "2025"
            brand: "Topps"
            series: "Chrome x Cactus Jack"
          - year: "2025"
            brand: "Panini"
            series: "By Storm"
          - year: "2025"
            brand: "Panini"
            series: "Draft Diamonds"
          - year: "2025"
            brand: "Panini"
            series: "Rookie Wave"
          - year: "2025"
            brand: "Panini"
            series: "Select"
          - year: "2025"
            brand: "Topps"
            series: "Tokyo Series"
          - year: "2025"
            brand: "Panini"
            series: "Kaboom - Vertical"
          - year: "2025"
            brand: "Panini"
            series: "Kaboom - Horizontal"
          - year: "2024"
            brand: "Panini"
            series: "Donruss"

    name: Sync (${{ matrix.year }} ${{ matrix.brand }} ${{ matrix.series }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run Matrix Targeted Sync Task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        # 🚀 Passes the separate matrix keys into our newly upgraded CLI python script parameters
        run: python update_by_set.py "${{ matrix.year }}" "${{ matrix.brand }}" "${{ matrix.series }}"