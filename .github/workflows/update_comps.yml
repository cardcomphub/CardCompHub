name: Automated Daily Market & Stats Sweep

on:
  schedule:
    # Automatically runs every day at 05:00 UTC (1:00 AM EST)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows you to click a button and trigger an immediate run manually anytime

jobs:
  data-sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up runner boot times by caching your pip downloads

      - name: Install Network & Database Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase beautifulsoup4

      - name: Step 1 - Execute Market Price Scraper Floor Sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python update_comps.py

      - name: Step 2 - Execute Dynamic ESPN Stats Leadership Alignment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_stats_leaders.py