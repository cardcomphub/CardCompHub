name: Automated Daily Stats Sweep

on:
  schedule:
    # 🕒 Automatically runs every day at 05:00 UTC (1:00 AM EST)
    - cron: '0 5 * * *'
  workflow_dispatch: # 🚀 Allows you to trigger a run manually anytime via the GitHub dashboard

jobs:
  stats-sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Database Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Execute Dynamic ESPN Stats Leadership Alignment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_stats_leaders.py