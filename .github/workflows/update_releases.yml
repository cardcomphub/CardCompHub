name: Sync Card Release Dates (Beckett Deep Scrape)

on:
  workflow_dispatch: # Allows manual triggers from the Actions tab
  schedule:
    - cron: '0 4 * * 5' # Automatically runs every Friday at 4:00 AM UTC

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        # 🎯 Added 'openai' to the installation list
        run: pip install supabase requests beautifulsoup4 feedparser openai

      - name: Run Release Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # 🎯 Pass your OpenAI key
        run: python update_releases.py
